<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 410" width="2600" height="820">
  <defs>
    <!-- aquarela: bordas irregulares -->
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.6"/>
    </filter>
    <filter id="wc2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- traço de tinta levemente irregular -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <radialGradient id="sea" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8FC3D6"/><stop offset=".7" stop-color="#B9DCE6"/><stop offset="1" stop-color="#E4F1F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#F7CF6A"/><stop offset="1" stop-color="#E9A93B"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA48C"/><stop offset="1" stop-color="#A9C4AE"/>
    </linearGradient>
  </defs>

  <!-- céu: lua e estrelas -->
